name: Deploy to GitHub Pages

on:
  # Deploy on every push to the default branch.
  push:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The gate runs BEFORE the Pages artifact exists. If it fails, `build` never
  # runs, nothing is uploaded, and `deploy` cannot run because `needs: build`
  # is unsatisfied — no `if:` condition to get wrong, no way to deploy
  # untested bytes.
  #
  # Why a separate job instead of folding the tests into `build`:
  # `withastro/action@v3` installs, builds AND uploads in one step, with no
  # point to interpose anything. Replacing it with its own steps is not the
  # 1:1 translation it looks like — measured, it runs `setup-node@v7`,
  # `upload-pages-artifact@v5` and an Astro build cache via `actions/cache@v6`,
  # so we would be taking over the maintenance of three things. Meanwhile the
  # whole `build` job takes 15 seconds (measured on run 37581627084), and the
  # gate has to build its own dist/ anyway to serve it. Paying one extra build
  # is far cheaper than owning the action's internals.
  gate:
    name: QA gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the QA suite
        uses: ./.github/actions/qa
        with:
          target: preview
          retries: "0"
          quality-gate: "true"
          artifact-suffix: -main-${{ github.run_number }}

  build:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        # Installs deps, runs `astro build`, and uploads the Pages artifact.
        # Pin Node 22: the action defaults to Node 20, but Astro 7 needs >=22.12.
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
