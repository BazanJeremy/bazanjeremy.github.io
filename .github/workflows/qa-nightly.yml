name: QA nightly

# Two things the deploy gate deliberately does not do, because they would make
# a gate non-deterministic or wrong:
#
#   - look at PRODUCTION. The trailing-slash 301 of GitHub Pages does not exist
#     under `astro preview`, so only a run against the live site can check it.
#   - depend on third parties (external destinations) and on other rendering
#     engines, which are slow to install.
#
# This is also the instrument run, as opposed to the gate run: retries are ON
# and the Allure quality gate is OFF. A gate is a single-attempt measurement;
# retries are an instrument for measuring flakiness, not a gate behaviour, and
# Allure's quality gate is incompatible with retries anyway. The two never
# share a run.

on:
  schedule:
    # 04:17 UTC — off the hour, where hosted runners are less contended.
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which part to run.
        type: choice
        default: full
        options:
          - full
          - live
          - gate
          - cross-browser
          - motion
          - a11y
          - prod-http
          - external-links
      browsers:
        description: Browsers to install for the preview part.
        type: choice
        default: chromium
        options:
          - chromium
          - chromium firefox webkit
      retries:
        description: Retries. Keep above 0 to feed the flakiness signal.
        type: string
        default: "2"

permissions:
  contents: read

# Its own group, never `pages`: sharing the deploy group would queue a nightly
# behind a production deploy, or worse, delay a deploy behind a nightly.
# `cancel-in-progress: false` because a manual run should not kill a scheduled
# one that is already collecting data.
concurrency:
  group: qa-nightly
  cancel-in-progress: false

jobs:
  # One job whose only purpose is to turn the inputs into a plan, so that the
  # effective parameters of a run appear in ONE place in the log. That matters
  # later, when the question is "what exactly did last Tuesday's nightly run?".
  #
  # On a `schedule` trigger the `inputs` context is empty, so `inputs.x`
  # evaluates to '' — falsy. The `||` defaults below ARE the nightly contract,
  # and they are deliberately not the same as the dispatch defaults: a human
  # running this by hand usually wants a fast answer (chromium), while the
  # schedule wants full coverage (three engines).
  resolve:
    name: Resolve the plan
    runs-on: ubuntu-latest
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      browsers: ${{ steps.plan.outputs.browsers }}
      retries: ${{ steps.plan.outputs.retries }}
      live_projects: ${{ steps.plan.outputs.live_projects }}
      preview_projects: ${{ steps.plan.outputs.preview_projects }}
    steps:
      - name: Resolve
        id: plan
        shell: bash
        env:
          IN_SUITE: ${{ inputs.suite }}
          IN_BROWSERS: ${{ inputs.browsers }}
          IN_RETRIES: ${{ inputs.retries }}
          IS_SCHEDULE: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail

          SUITE="${IN_SUITE:-full}"
          RETRIES="${IN_RETRIES:-2}"

          # The schedule covers all three engines; a manual run defaults to
          # chromium unless the person asked for more.
          if [ -n "${IN_BROWSERS:-}" ]; then
            BROWSERS="$IN_BROWSERS"
          elif [ "$IS_SCHEDULE" = "true" ]; then
            BROWSERS="chromium firefox webkit"
          else
            BROWSERS="chromium"
          fi

          LIVE=""
          PREVIEW=""
          case "$SUITE" in
            full)
              LIVE="prod-http external-links"
              # `a11y-axe` is listed here explicitly: this plan enumerates its
              # projects, so a new project is absent from "full" until named.
              PREVIEW="invariants-gate gate-desktop gate-mobile motion a11y-axe"
              case "$BROWSERS" in
                *firefox*) PREVIEW="$PREVIEW gate-firefox" ;;
              esac
              case "$BROWSERS" in
                *webkit*) PREVIEW="$PREVIEW gate-webkit" ;;
              esac
              ;;
            live)           LIVE="prod-http external-links" ;;
            prod-http)      LIVE="prod-http" ;;
            external-links) LIVE="external-links" ;;
            gate)           PREVIEW="invariants-gate gate-desktop gate-mobile" ;;
            motion)         PREVIEW="motion" ;;
            a11y)           PREVIEW="a11y-axe" ;;
            cross-browser)
              PREVIEW="gate-firefox gate-webkit"
              BROWSERS="chromium firefox webkit"
              ;;
            *)
              echo "::error::Unknown suite '$SUITE'."
              exit 1
              ;;
          esac

          {
            echo "suite=$SUITE"
            echo "browsers=$BROWSERS"
            echo "retries=$RETRIES"
            echo "live_projects=$LIVE"
            echo "preview_projects=$PREVIEW"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### QA nightly plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| suite | \`$SUITE\` |"
            echo "| retries | \`$RETRIES\` |"
            echo "| browsers | \`$BROWSERS\` |"
            echo "| against production | \`${LIVE:-—}\` |"
            echo "| against a fresh build | \`${PREVIEW:-—}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Against the live site. No build, no preview server, no page: these specs
  # use the request context only.
  live:
    name: Production
    needs: resolve
    if: needs.resolve.outputs.live_projects != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the production checks
        uses: ./.github/actions/qa
        with:
          target: production
          projects: ${{ needs.resolve.outputs.live_projects }}
          retries: ${{ needs.resolve.outputs.retries }}
          # OFF: incompatible with retries, and nothing here should gate.
          quality-gate: "false"
          # OFF: this is the instrument run. A type error can only be red here
          # if `main` is already broken, which the deploy gate stops before the
          # merge — so it would only add noise to a flakiness measurement.
          typecheck: "false"
          # WRITE ONLY ON `schedule`. A manual run picks its own `suite`, so
          # its project set varies — and a history whose test set changes from
          # one run to the next dilutes the very comparison it exists for. The
          # scheduled run is the controlled series; a manual one still reads the
          # trend, it just does not feed it.
          history: ${{ github.event_name == 'schedule' && 'write' || 'read' }}
          history-key: nightly-live
          browsers: chromium
          artifact-suffix: -nightly-${{ github.run_number }}-live

  # Against a fresh build, served locally. This is the cross-engine replay plus
  # the motion spec.
  preview:
    name: Fresh build
    needs: resolve
    if: needs.resolve.outputs.preview_projects != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run the suite against a fresh build
        uses: ./.github/actions/qa
        with:
          target: preview
          projects: ${{ needs.resolve.outputs.preview_projects }}
          retries: ${{ needs.resolve.outputs.retries }}
          quality-gate: "false"
          # OFF for the same reason as the `live` job above.
          typecheck: "false"
          # Same rule as the `live` job: only the scheduled run feeds the series.
          history: ${{ github.event_name == 'schedule' && 'write' || 'read' }}
          history-key: nightly-preview
          browsers: ${{ needs.resolve.outputs.browsers }}
          artifact-suffix: -nightly-${{ github.run_number }}-preview

  # ------------------------------------------------------------------ verdict
  # Lit l'HISTORIQUE, pas le resultat de ce run : aucun `needs`, et il tourne
  # aussi bien sur `schedule` que sur lancement manuel ("qu'est-ce qui est
  # instable en ce moment ?").
  #
  # JAMAIS BLOQUANT, et par le critere ecrit de ce depot : l'ensemble bloquant
  # est "ce qui est deterministe et ne depend que de ce depot". Ces deux outils
  # vivent dans d'AUTRES depots et s'installent par le reseau, donc ils n'y ont
  # pas leur place. Les codes de sortie sont lus et rendus, jamais propages.
  verdict:
    name: Flakiness + release verdict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Lecture seule, et pas de `save` : ce job ne produit aucun JUnit, il
      # consomme la serie de reference ecrite par le gate de `deploy.yml`.
      # Un cache froid ne fait pas echouer le job : les deux scripts rendent un
      # resume utile sans historique.
      - name: Restore the main-gate JUnit history
        id: history
        uses: actions/cache/restore@v4
        with:
          path: .qa-history
          key: qa-history-main-gate-${{ github.run_id }}
          restore-keys: |
            qa-history-main-gate-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14 parce que c'est la version sur laquelle la chaine a ete
          # MESUREE le 12.10 (3.14.6). Les deux outils declarent >= 3.12 ;
          # faire tourner la CI sur autre chose que la version mesuree
          # rouvrirait une inconnue pour rien.
          python-version: "3.14"

      - name: Install the tools
        shell: bash
        run: |
          # EPINGLES AU COMMIT, pas a une branche. Ce sont des instruments de
          # mesure : le meme historique doit rendre le meme verdict demain.
          # `pydantic` reste resolu par pip — dependance reseau assumee pour un
          # instrument non bloquant.
          python -m pip install --quiet             "flakysense @ git+https://github.com/BazanJeremy/flakysense@b7d732dd7eeb9362aaa37c7ecd5147ef0457660b"             "releaseguard @ git+https://github.com/BazanJeremy/ReleaseGuard@bbb5a76b867375e1a1d2eacba2373d6e9d854e1a"
          python -m pip list | grep -iE 'flakysense|releaseguard|pydantic'

      - name: Analyse the history
        id: analyse
        shell: bash
        run: |
          mkdir -p qa-verdict
          ROOT=.qa-history/junit

          if [ ! -d "$ROOT" ] || [ -z "$(ls -A "$ROOT" 2>/dev/null)" ]; then
            echo "::notice title=No history yet::$ROOT is empty. The series fills up one run per merge to main; nothing to analyse yet."
            echo "runs=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RUNS=$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "runs=$RUNS" >> "$GITHUB_OUTPUT"
          echo "$RUNS run(s) in the history"

          # Exit codes are a CONTRACT, not noise: flakysense uses the grep
          # convention — 0 = ran, nothing flaky; 1 = flaky found; 2 = could not
          # run. Only 2 is a problem.
          set +e
          flakysense "$ROOT" --json > qa-verdict/flakysense-report.json
          FS=$?
          set -e
          if [ "$FS" -eq 2 ]; then
            echo "::warning title=FlakySense could not run::See the log. The release verdict will be computed without a flakiness signal."
            rm -f qa-verdict/flakysense-report.json
          fi

          # Le JUnit le plus recent de la serie. Les noms de dossier commencent
          # par un horodatage UTC de longueur fixe, donc `sort` est bien un tri
          # chronologique.
          LATEST=$(find "$ROOT" -mindepth 2 -maxdepth 2 -name junit.xml | sort | tail -1)
          echo "latest JUnit: $LATEST"

          FLAG=""
          [ -f qa-verdict/flakysense-report.json ] && FLAG="--flaky qa-verdict/flakysense-report.json"

          # 0 GO, 1 CONDITIONAL GO, 2 NO GO, 3 error. Aucun ne fait echouer ce
          # job : le verdict est rendu, il ne gate rien.
          set +e
          releaseguard --junit "$LATEST" $FLAG --json > qa-verdict/releaseguard.json
          RG=$?
          set -e
          echo "releaseguard exit: $RG"
          if [ "$RG" -eq 3 ]; then
            echo "::warning title=ReleaseGuard errored::Exit 3 means it could not evaluate. See the log."
            rm -f qa-verdict/releaseguard.json
          fi

      - name: Write the run summary
        if: always()
        shell: bash
        run: |
          node scripts/qa-verdict-summary.mjs             --flaky qa-verdict/flakysense-report.json             --verdict qa-verdict/releaseguard.json             --runs "${{ steps.analyse.outputs.runs || 0 }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the verdict reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-verdict-${{ github.run_number }}
          path: qa-verdict
          if-no-files-found: ignore
          retention-days: 30
